# Netlify build for the public demo (https://tally.arealjagema.com).
# Netlify detects Next.js and applies its Next.js runtime automatically.
#
# Set one secret in Netlify → Site configuration → Environment variables:
#   JWT_SECRET   long random string (signs the demo session cookie)
# No database or third-party keys are needed: data lives in memory (lib/demo).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_API_URL = "https://tally.arealjagema.com"
  NEXT_PUBLIC_APP_URL = "https://tally.arealjagema.com"
